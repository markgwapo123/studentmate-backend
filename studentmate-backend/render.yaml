services:
  - type: web
    name: studentmate-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: studentmate
      - key: ALLOWED_ORIGINS
        value: https://studentmate-frontend.vercel.app,https://studentmate-master.openpond.chatgpt.site
